name: Debian packages

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

env:
  KALINKA_SDK_REF: ${{ vars.KALINKA_SDK_REF || 'kalinka-v5.9.1' }}

jobs:
  deb:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian13-arm64
            runner: ubuntu-24.04-arm
            image: debian:13-slim
          - target: debian13-amd64
            runner: ubuntu-24.04
            image: debian:13-slim
          - target: ubuntu2404-arm64
            runner: ubuntu-24.04-arm
            image: ubuntu:24.04
          - target: ubuntu2404-amd64
            runner: ubuntu-24.04
            image: ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install build tools
        # Git must precede checkout so setuptools_scm gets a real clone.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates python3 python3-venv dpkg-dev
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Prepare Python environment
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv "$RUNNER_TEMP/tidal-venv"
          echo "$RUNNER_TEMP/tidal-venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/tidal-venv/bin/python" -m pip install --upgrade pip build setuptools-scm
      - name: Build wheel and Debian package
        run: ./scripts/build_deb.sh
      - name: Inspect package and test the packaged wheel
        run: |
          mkdir -p out
          deb=$(find . -maxdepth 1 -name 'kalinka-plugin-tidal_*_all.deb' -print)
          python scripts/check_package.py "$deb" > out/build-info.json
          dpkg-deb --extract "$deb" "$RUNNER_TEMP/tidal-package"
          python -m pip install \
            "kalinka-plugin-sdk @ git+https://github.com/Kalinka-Player/KalinkaPlayer@${KALINKA_SDK_REF}#subdirectory=packages/kalinka-plugin-sdk" \
            "$RUNNER_TEMP"/tidal-package/opt/kalinka/wheels/*.whl \
            pytest pytest-asyncio
          python -m pytest -q
          cp "$deb" out/
          (cd out && sha256sum *.deb > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
