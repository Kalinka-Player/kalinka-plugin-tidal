name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

env:
  # SDK 3.19.0, including the audio codec API; keep overrides at 3.19 or newer.
  KALINKA_SDK_REF: ${{ vars.KALINKA_SDK_REF || 'e1e9d03db6f6b9fdd7e82411ad1c27cd709e5693' }}

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install SDK and plugin
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "kalinka-plugin-sdk @ git+https://github.com/Kalinka-Player/KalinkaPlayer@${KALINKA_SDK_REF}#subdirectory=packages/kalinka-plugin-sdk" \
            -e '.[dev]'
      - name: Test and lint
        run: |
          python -m pytest -q
          python -m flake8 --select=F src tests scripts/check_package.py
          bash -n scripts/*.sh debian/prerm
